<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Access Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: center;
        }
        video {
            width: 100%;
            max-width: 360px;
            background-color: #666;
            margin-top: 10px;
            border-radius: 4px;
        }
        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Camera Interface</h2>
    <p>Click the button below to turn on the front camera. The browser will ask for your permission.</p>
    
    <button id="start-camera" class="button">Start Camera</button>
    
    <!-- The video element displays the stream transparently to the user -->
    <video id="video-preview" autoplay playsinline></video>
</div>

<script>
    const startButton = document.getElementById('start-camera');
    const videoElement = document.getElementById('video-preview');

    startButton.addEventListener('click', async () => {
        try {
            // Requesting access explicitly specifying the front-facing camera
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });
            
            // Assigning the stream to the video element to show the user what the camera sees
            videoElement.srcObject = stream;
        } catch (error) {
            console.error("Error accessing the camera: ", error);
            alert("Camera access denied or unavailable.");
        }
    });
</script>

</body>
</html>
